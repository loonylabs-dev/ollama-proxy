services:
  # Ollama GPU Service (Intel Arc)
  ollama-gpu:
    image: intelanalytics/ipex-llm-inference-cpp-xpu:latest
    pull_policy: if_not_present
    restart: unless-stopped
    devices:
      - /dev/dri:/dev/dri  # Intel GPU device access
    volumes:
      - ollama_gpu_data:/root/.ollama
      - ./ollama/ollama.json:/root/.ollama/ollama.json
      - ./models:/models  # Custom GGUF models and Modelfiles
    networks:
      - ollama_network
    environment:
      # Intel GPU Selection
      - ONEAPI_DEVICE_SELECTOR=level_zero:0
      # Ollama Configuration
      - OLLAMA_DEBUG=1
      - OLLAMA_KEEP_ALIVE=60m
      - OLLAMA_VERBOSE=1
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_NUM_PARALLEL=1
      - OLLAMA_NUM_CTX=16384
      - OLLAMA_NUM_THREAD=8
      - OLLAMA_MLOCK=false
      - OLLAMA_NUM_BATCH=512  # Higher value for better performance
      - OLLAMA_MAX_LOADED_MODELS=1  # Only one model in VRAM at a time
      - OLLAMA_MAX_QUEUE=20  # Allow up to 20 queued requests
      - OLLAMA_NEW_ESTIMATES=1  # Enable improved memory management
    deploy:
      resources:
        reservations:
          memory: 8G
        limits:
          memory: 16G
    shm_size: 4gb  # Increase from default 64MB to 4GB
    command: serve
    ulimits:
      memlock: -1  # Unlimited locked memory

  # Ollama CPU Service
  ollama-cpu:
    image: ollama/ollama:0.12.0
    pull_policy: if_not_present
    restart: unless-stopped
    volumes:
      - ollama_cpu_data:/root/.ollama
      - ./ollama/ollama.json:/root/.ollama/ollama.json
    networks:
      - ollama_network
    environment:
      - OLLAMA_DEBUG=1
      - OLLAMA_KEEP_ALIVE=60m
      - OLLAMA_VERBOSE=1
      - OLLAMA_HOST=0.0.0.0:11434
      - OLLAMA_NUM_PARALLEL=4  # More parallel requests for CPU
      - OLLAMA_NUM_CTX=16384
      - OLLAMA_NUM_THREAD=16   # More threads for CPU processing
      - OLLAMA_MLOCK=false
      - OLLAMA_NUM_BATCH=512
    deploy:
      resources:
        reservations:
          memory: 8G
        limits:
          memory: 16G
    command: serve

  proxy:
    build: .
    restart: unless-stopped
    volumes:
      - ./model-routing.json:/app/model-routing.json:ro
    environment:
      - API_KEY=${API_KEY}
      - OLLAMA_GPU_URL=${OLLAMA_GPU_URL:-http://ollama-gpu:11434}
      - OLLAMA_CPU_URL=${OLLAMA_CPU_URL:-http://ollama-cpu:11434}
    depends_on:
      - ollama-gpu
      - ollama-cpu
    networks:
      - ollama_network

  # Cloudflared Tunnel
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    networks:
      - ollama_network
    volumes:
      - ./cloudflare:/etc/cloudflared
    command: tunnel --no-autoupdate run
    depends_on:
      - proxy

  # GPU Watchdog Service
  # Note: Intel Arc GPUs are more stable than NVIDIA with Ollama
  # This watchdog can still help detect memory issues
  watchdog-gpu:
    build: ./watchdog-gpu
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./logs/watchdog:/var/log/watchdog
      - ./docker-compose.intel.yml:/etc/watchdog/docker-compose.yml:ro
    environment:
      - MONITORED_CONTAINER=ollama-proxy-ollama-gpu-1
      - COMPOSE_SERVICE_NAME=ollama-gpu
      - CHECK_INTERVAL=5
      - RESTART_COOLDOWN=60
      - LOG_LEVEL=INFO
      - COMPOSE_FILE=/etc/watchdog/docker-compose.yml
      - COMPOSE_PROJECT_NAME=ollama-proxy
    depends_on:
      - ollama-gpu
    networks:
      - ollama_network
    healthcheck:
      test: ["CMD", "/usr/local/bin/watchdog.sh", "healthcheck"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  ollama_gpu_data:
  ollama_cpu_data:

networks:
  ollama_network:

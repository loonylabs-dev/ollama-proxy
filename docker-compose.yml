# ============================================================================
# Ollama Proxy - Docker Compose Selection Guide
# ============================================================================
#
# This repository provides TWO different docker-compose configurations:
#
# 1. docker-compose.nvidia.yml - For NVIDIA GPUs (RTX, Tesla, etc.)
# 2. docker-compose.intel.yml  - For Intel Arc GPUs (A380, A770, Arc iGPUs)
#
# ============================================================================
# IMPORTANT: Choose ONE configuration based on your GPU
# ============================================================================
#
# OPTION 1: NVIDIA GPU Setup (RTX, Tesla, A100, etc.)
# ----------------------------------------------------------------------------
# Use this if you have:
# - NVIDIA RTX series (3060, 3090, 4090, 5090, etc.)
# - NVIDIA Tesla/Datacenter GPUs
# - NVIDIA Quadro
#
# Requirements:
# - NVIDIA Docker runtime installed (nvidia-docker2)
# - NVIDIA drivers 545.x+ recommended
#
# Start with:
#   docker-compose -f docker-compose.nvidia.yml up -d
#
# Or create a symlink (Linux/macOS):
#   ln -s docker-compose.nvidia.yml docker-compose.yml
#   docker-compose up -d
#
# Or copy to docker-compose.yml (Windows):
#   copy docker-compose.nvidia.yml docker-compose.yml
#   docker-compose up -d
#
# ============================================================================
# OPTION 2: Intel Arc GPU Setup (A380, A770, Arc 140V iGPU, etc.)
# ----------------------------------------------------------------------------
# Use this if you have:
# - Intel Arc discrete GPUs (A310, A380, A580, A770)
# - Intel Arc integrated GPUs (Intel Core Ultra with Arc iGPU)
# - Intel Flex or Max series (datacenter)
#
# Requirements:
# - Ubuntu 24.04+ (for latest Intel Arc kernel drivers)
# - Intel oneAPI drivers installed
#
# Start with:
#   docker-compose -f docker-compose.intel.yml up -d
#
# Or create a symlink (Linux):
#   ln -s docker-compose.intel.yml docker-compose.yml
#   docker-compose up -d
#
# Or copy to docker-compose.yml (Windows):
#   copy docker-compose.intel.yml docker-compose.yml
#   docker-compose up -d
#
# ============================================================================
# Multiple GPU Detection
# ============================================================================
#
# If you have BOTH Intel and NVIDIA GPUs:
# - Choose based on which GPU you want Ollama to use
# - Intel version: Set ONEAPI_DEVICE_SELECTOR in docker-compose.intel.yml
#   to select the correct Intel GPU (use sycl-ls to list devices)
#
# ============================================================================
# Quick Start Examples
# ============================================================================
#
# NVIDIA users:
#   cp .env.example .env
#   # Edit .env with your API_KEY
#   docker-compose -f docker-compose.nvidia.yml up -d
#
# Intel Arc users:
#   cp .env.example .env
#   # Edit .env with your API_KEY
#   docker-compose -f docker-compose.intel.yml up -d
#
# ============================================================================
# For more information, see README.md
# ============================================================================

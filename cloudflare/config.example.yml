# Cloudflare Tunnel Configuration Example
# Copy this file to cloudflare.yml and update with your tunnel details

tunnel: your-tunnel-id-here
credentials-file: /etc/cloudflared/your-tunnel-id-here.json

ingress:
  - hostname: your-domain.example.com  # Do NOT include protocol or port
    service: http://proxy:3000         # Target service URL inside Docker network
  - service: http_status:404
